services:
  influxdb:
    image: influxdb:2
    container_name: sensores_db
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=ujaen
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    container_name: sensores_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  api:
    build: ./api
    container_name: sensores_api
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=ujaen
      - INFLUXDB_BUCKET=sensores_bucket
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - influxdb
      - mosquitto
    volumes:
      - ./api:/app

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: sensores_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  influxdb-data:
  grafana-data: